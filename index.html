<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="しおり">
<meta name="theme-color" content="#3F5D63">
<title>旅のしおり</title>
<script>try{var _s=JSON.parse(localStorage.getItem('shiori_v1')||'{}');document.documentElement.setAttribute('data-theme',['space','winter','cat','dog'].indexOf(_s.theme)>=0?_s.theme:'ryokan');}catch(e){document.documentElement.setAttribute('data-theme','ryokan');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&family=Orbitron:wght@500;700&family=Murecho:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Zen+Old+Mincho:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Quicksand:wght@500;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#5F7F86; --pink-d:#43626A; --petal:#E3ECEC; --blush:#F4F6F6;
  --line:#D2DDDD; --ink:#26333A; --sub:#6C7C80; --white:#fff; --mint:#2F9E8F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Noto Sans JP',-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--blush); color:var(--ink); font-size:15px; line-height:1.6;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:6px}
.i{display:block;flex-shrink:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
/* iOSホーム画面アプリで画面の下端が届かない問題の対策 */
/* 画像・ジャンプ・精算 */
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{flex:0 0 auto;width:84px;height:84px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--petal);color:var(--sub);font-size:10px;line-height:1.3}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:200;background:rgba(20,28,32,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb img{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain}
.lb .lb-msg{color:#fff;font-size:13px;text-align:center;line-height:1.7}
.lb .lb-row{display:flex;gap:10px}
.lb a,.lb button{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:0;text-decoration:none}
.lb a{background:#fff;color:var(--pink-d)}
.lb button{background:rgba(255,255,255,.18);color:#fff}
button.chip{border:0;font:inherit;font-size:12px;cursor:pointer}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px #d8c49a}100%{box-shadow:0 0 0 0 transparent}}
.payer{font-size:11px;font-weight:700;color:var(--sub);margin-left:6px}

html,body{background:#fff}
#app{background:var(--blush)}
html.shim nav{padding-bottom:0}

/* ---------- header (ticket) ---------- */
.ticket{
  position:relative;background:var(--pink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 30px;
}
.ticket::after{
  content:'';position:absolute;left:0;right:0;bottom:-8px;height:16px;
  background:radial-gradient(circle at 8px 8px,var(--blush) 5px,transparent 5.5px) repeat-x;
  background-size:16px 16px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbtns{display:flex;gap:4px;align-items:center}
.hbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hbtn:active{background:rgba(255,255,255,.18)}
.hmain{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.ticket h1{margin:0;font-size:28px;font-weight:900;line-height:1.25;word-break:break-word}
.dates{font-size:13px;font-weight:500;opacity:.9;margin-top:6px}
.stamp{
  flex-shrink:0;width:84px;height:84px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.85);display:flex;flex-direction:column;
  align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1.1;
}
.stamp small{font-size:11px;font-weight:700}
.stamp b{font-size:30px;font-weight:900}
.stamp.word b{font-size:15px}

.ro-bar{
  margin:18px 16px 0;padding:12px 14px;border-radius:14px;background:var(--white);
  border:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;
}
.ro-bar span{flex:1;color:var(--sub)}

/* ---------- main ---------- */
main{flex:1;padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.sec-h h2{margin:0;font-size:17px;font-weight:900}
.sec-h .meta{font-size:12px;color:var(--sub);font-weight:500}

/* schedule */
.day{margin-bottom:26px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px}
.dnum{font-size:20px;font-weight:900;color:var(--pink)}
.ddate{font-size:14px;font-weight:700}
.tl{position:relative;padding-left:0}
.tl::before{content:'';position:absolute;left:69px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.ev{display:grid;grid-template-columns:52px 36px 1fr;gap:0;align-items:start;padding:6px 0;position:relative}
.evtime{font-size:14px;font-weight:700;text-align:right;padding-right:6px;padding-top:8px;font-variant-numeric:tabular-nums}
.evtime small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.evdot{
  width:32px;height:32px;margin:2px 2px 0;border-radius:50%;background:var(--white);
  border:2px solid var(--line);display:grid;place-items:center;color:var(--pink);position:relative;z-index:1;
}
.evbody{
  background:var(--white);border-radius:14px;padding:10px 12px;margin-left:6px;
  border:1px solid var(--line);text-align:left;width:calc(100% - 6px);
}
.evtitle{font-weight:700;font-size:15px;line-height:1.45}
.evmemo{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
.ev.now .evdot{background:var(--pink);border-color:var(--pink);color:#fff}
.ev.now .evbody{border:2px solid var(--pink)}
.nowtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;max-width:100%;
  font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;
  background:var(--petal);color:var(--pink-d);text-decoration:none;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{
  display:flex;align-items:center;gap:8px;margin:6px 0 0 88px;padding:8px 12px;
  border:1.5px dashed var(--line);border-radius:12px;color:var(--pink-d);font-size:13px;font-weight:700;
  width:calc(100% - 88px);
}
.addrow:active{background:var(--petal)}

/* info */
.cat-h{display:flex;align-items:center;gap:8px;margin:0 4px 10px;color:var(--pink-d)}
.cat-h h3{margin:0;font-size:15px;font-weight:900;color:var(--ink)}
.cat-h .cnt{font-size:12px;color:var(--sub)}
.card{
  display:block;width:100%;text-align:left;background:var(--white);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;
}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card-name{font-weight:700;font-size:15px}
.card-cost{font-weight:900;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card-row{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--sub);margin-top:6px}
.card-row .i{margin-top:2px;color:var(--pink)}

/* money */
.big{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:56px 1fr 84px;align-items:center;gap:8px;font-size:13px}
.bar-t{height:8px;background:var(--petal);border-radius:8px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--pink);border-radius:8px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.diff{font-size:13px;font-weight:700;margin-top:4px}
.diff.over{color:var(--pink-d)} .diff.under{color:var(--mint)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--petal);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .t{font-weight:700}
.row .s{font-size:12px;color:var(--sub)}
.row .a{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-panel{background:transparent;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.who{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:700}
.welcome .note{font-size:12px;color:var(--sub);margin:-8px 0 18px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.mchip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:13px;font-weight:700}
.mchip button{width:22px;height:22px;display:grid;place-items:center;color:var(--sub);border-radius:50%}
.settle{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--petal);font-size:14px}
.settle:last-child{border-bottom:0}
.settle .arrow{color:var(--pink)}
.settle b{margin-left:auto;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--sub)}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ptable th{font-weight:500;color:var(--sub);text-align:right;padding:4px 0}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td{padding:6px 0;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--petal)}

/* prep */
.prog{height:6px;background:var(--petal);border-radius:6px;overflow:hidden;margin:0 4px 10px}
.prog i{display:block;height:100%;background:var(--pink);transition:width .25s}
.chk{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--white);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex-shrink:0;transition:background .15s,border-color .15s}
.chk.done .box{background:var(--pink);border-color:var(--pink)}
.chk .txt{flex:1;text-align:left;font-size:15px}
.chk.done .txt{color:var(--sub);text-decoration:line-through}
.chk .del{width:30px;height:30px;display:grid;place-items:center;color:var(--sub);border-radius:50%}
.addline{display:flex;gap:8px;margin-top:4px}
.addline input{flex:1}
.addline .own{white-space:nowrap;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--sub);background:var(--blush)}
.addline .own.on{border-color:var(--pink);color:var(--pink-d);background:#fff}
.otag{display:inline-block;font-size:11px;font-weight:700;color:var(--pink-d);background:var(--petal);border-radius:999px;padding:0 8px;margin-left:6px;text-decoration:none;vertical-align:1px}
.shrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shrow b{width:5.5em;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shrow input{flex:1}
.ptable tr[data-mem]{cursor:pointer}
.ptable tr[data-mem] td:first-child{color:var(--pink-d);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.net{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.net small{font-size:13px;font-weight:700;margin-right:6px;color:var(--sub)}

/* fab & nav */
.fab{
  position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(80px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(67,98,106,.3);z-index:20;
}
.fab:active{background:var(--pink-d)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--sub)}
nav button.on{color:var(--pink)}

/* forms & sheet */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
input,select,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--blush);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink);background:#fff}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);font-size:11px;font-weight:700;color:var(--sub);background:var(--blush)}
.seg button.on{border-color:var(--pink);color:var(--pink);background:#fff}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);background:var(--blush)}
.tchips button.on{border-color:var(--pink);background:var(--pink);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:14px;background:var(--pink);color:#fff;font-weight:700;font-size:15px}
.btn:active{background:var(--pink-d)}
.btn.ghost{background:transparent;color:var(--pink-d);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--pink-d);margin-top:10px}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(38,51,58,.42);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{
  width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .22s;
}
.sheet-bg.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{margin:0;font-size:18px;font-weight:900}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--sub)}
.tlist .row{cursor:pointer}
.cur{font-size:11px;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:1px 8px}

.empty{text-align:center;padding:30px 16px;color:var(--sub);font-size:14px}
.empty .i{margin:0 auto 10px;color:var(--line)}
.welcome{padding:calc(env(safe-area-inset-top,0px) + 48px) 22px 40px}
.welcome h1{font-size:30px;font-weight:900;margin:0 0 6px;color:var(--pink)}
.welcome p{color:var(--sub);margin:0 0 28px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== luxe (A案) ===== */
:root{
  --pink:#3F5D63; --pink-d:#2F474C; --petal:#EAEFEE; --blush:#F7F6F2;
  --line:#DDE1DC; --ink:#232D2C; --sub:#6F7A78; --gold:#A98F5B; --gold-l:#CDBB91;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
body{letter-spacing:.02em}
.ticket h1,.sec-h h2,.dnum,.big,.net,.stamp b,.welcome h1,.sheet-h h2,.cat-h h3,.card-name,.evtitle{font-family:var(--serif)}
.ticket{background:var(--pink);padding-bottom:34px}
.ticket::after{background:none;height:0;left:20px;right:20px;bottom:16px;border-top:1px solid var(--gold-l);opacity:.75}
.brand{color:var(--gold-l);opacity:1;letter-spacing:.18em;font-weight:500}
.ticket h1{font-weight:600;font-size:29px;letter-spacing:.06em}
.dates{letter-spacing:.08em;opacity:.85}
.stamp{transform:none;border:1px solid var(--gold-l);outline:1px solid rgba(205,187,145,.45);outline-offset:3px;width:78px;height:78px}
.stamp small{font-weight:500;letter-spacing:.1em;font-size:10px;color:var(--gold-l)}
.stamp b{font-weight:600;font-size:28px}
.stamp.word b{font-size:14px;letter-spacing:.1em}
.who{background:transparent;border:1px solid rgba(205,187,145,.6);color:#fff;border-radius:4px;font-weight:500}
main{padding-top:28px}
.sec-h{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.sec-h h2{font-weight:600;font-size:18px;letter-spacing:.06em}
.sec-h .meta{letter-spacing:.06em}
.dayhead{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.dnum{font-weight:600;font-size:21px;color:var(--pink);letter-spacing:.04em}
.ddate{font-weight:500;color:var(--sub);letter-spacing:.06em}
.ddate::before{content:'';display:inline-block;width:14px;height:1px;background:var(--gold);vertical-align:middle;margin-right:10px}
.tl::before{width:1px;background:var(--gold-l);left:70px}
.evtime{font-weight:500;letter-spacing:.04em}
.evdot{border:1px solid var(--gold-l);background:var(--blush)}
.evbody{border-radius:6px;border-color:var(--line);background:#fff}
.evtitle{font-weight:600;letter-spacing:.03em}
.ev.now .evdot{background:var(--pink);border-color:var(--gold);color:#fff}
.ev.now .evbody{border:1px solid var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.nowtag{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:3px;font-weight:500;letter-spacing:.1em}
.chip{border-radius:3px;background:transparent;border:1px solid var(--line);color:var(--pink);font-weight:500}
.addrow{border:1px dashed var(--gold-l);border-radius:6px;color:var(--pink);font-weight:500;letter-spacing:.06em}
.cat-h{color:var(--gold)}
.cat-h h3{font-weight:600;letter-spacing:.06em}
.card,.panel,.chk{border-radius:6px;border-color:var(--line)}
.card-name{font-weight:600;letter-spacing:.03em}
.card-cost{font-family:var(--serif);font-weight:600}
.big{font-weight:600;letter-spacing:.02em}
.bar-t{height:3px;border-radius:0;background:var(--line)}
.bar-t i{border-radius:0;background:var(--gold)}
.sub-panel{border:1px solid var(--line);border-radius:6px;background:#fff}
.row .a,.settle b{font-family:var(--serif);font-weight:600}
.prog{height:2px;border-radius:0;background:transparent;margin:-16px 0 16px;position:relative}
.ev{grid-template-columns:52px 36px minmax(0,1fr)}
.evbody{width:auto;min-width:0}
.chip{max-width:100%}
.prog i{background:var(--gold)}
.box{border:1px solid var(--gold-l);border-radius:4px;width:24px;height:24px}
.chk.done .box{background:var(--pink);border-color:var(--pink)}
.tchips button,.seg button{border-radius:4px;border-width:1px;background:#fff;font-weight:500}
.tchips button.on{background:var(--pink);border-color:var(--pink)}
.seg button.on{border-color:var(--gold);color:var(--pink)}
.mchip{border-radius:4px;font-weight:500}
.btn{border-radius:6px;font-weight:500;letter-spacing:.1em}
.btn.ghost{border-width:1px;border-color:var(--gold-l);color:var(--pink)}
.btn.danger{color:#8A4B45;letter-spacing:.06em}
.addline .own{border-radius:4px;border-width:1px}
input,select,textarea{border-radius:6px;border-width:1px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.fab{border-radius:50%;background:var(--pink);box-shadow:0 0 0 1px var(--gold-l) inset,0 4px 14px rgba(35,45,44,.18)}
nav{border-top:1px solid var(--line)}
nav button{font-weight:500;letter-spacing:.06em;position:relative}
nav button.on{color:var(--pink)}
nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:1px;background:var(--gold)}
.sheet{border-radius:12px 12px 0 0}
.sheet-h h2{font-weight:600;letter-spacing:.06em}
.welcome h1{font-weight:600;color:var(--pink);letter-spacing:.1em}
.welcome h1::after{content:'';display:block;width:36px;height:1px;background:var(--gold);margin-top:14px}
.otag{border-radius:3px;background:transparent;border:1px solid var(--gold-l);color:var(--gold)}
.cur{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:3px}
.toast{border-radius:4px;letter-spacing:.06em}

/* today & online */
.online{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;letter-spacing:.06em;color:var(--gold-l)}
.online:empty{display:none}
.online .dot{width:7px;height:7px;border-radius:50%;background:#9FD3A8;box-shadow:0 0 0 3px rgba(159,211,168,.22)}
.today{background:var(--pink);color:#fff;border:1px solid var(--gold-l);border-radius:6px;padding:16px 18px 14px;margin-bottom:28px}
.today-h{font-size:11px;letter-spacing:.2em;color:var(--gold-l)}
.today-l{font-size:12px;letter-spacing:.08em;opacity:.8;margin-top:10px}
.today-c{font-family:var(--serif);font-size:15px;line-height:1.2}
.today-c b{font-size:36px;font-weight:600;margin:0 4px;letter-spacing:.02em}
.today-n{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:8px;letter-spacing:.04em}
.today-n span{font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:500;color:var(--gold-l);margin-right:10px}
.today .chip{color:#fff;border-color:rgba(205,187,145,.55)}
.today-p{font-size:12px;opacity:.85;margin-top:12px;padding-top:9px;border-top:1px solid rgba(205,187,145,.35);letter-spacing:.04em}
.asg{flex-shrink:0;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--pink);border:1px solid var(--gold-l);border-radius:4px;padding:3px 9px;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asg.none{color:var(--sub);border-style:dashed;border-color:var(--line)}
.chk.done .asg{opacity:.55}

/* splash */
#splash{position:fixed;inset:0;z-index:999;background:#3F5D63;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:64px;height:auto;opacity:0;animation:spIn .9s ease .1s forwards}
#splash .t{font-family:var(--serif);color:#fff;font-size:22px;font-weight:600;letter-spacing:.32em;padding-left:.32em;opacity:0;animation:spIn .9s ease .35s forwards}
#splash .r{width:0;height:1px;background:#CDBB91;animation:spLine .8s ease .55s forwards}
@keyframes spIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spLine{to{width:48px}}
@media (prefers-reduced-motion:reduce){#splash svg,#splash .t{animation:none;opacity:1}#splash .r{animation:none;width:48px}}

.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--petal);color:var(--pink);border:1px solid var(--gold-l);font-family:var(--serif);font-weight:600;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.mw{display:inline-flex;align-items:center;gap:6px}
.tchips button.mw{padding-left:6px}
.tchips button.on .av{border-color:#fff}
.who .av{border-color:rgba(205,187,145,.8)}
.asg{display:inline-flex;align-items:center;gap:5px}
.mchip{padding-left:4px;gap:6px}
.mchip .avb{width:auto;height:auto}
.online .av{margin-right:-4px;border-color:rgba(205,187,145,.8)}
.online span{margin-left:8px}


/* 費用タブ 見た目調整 */
.cap{font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:2px}
.big{font-size:26px}
.net{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--petal);font-size:13px;font-family:inherit}
.net:last-child{border-bottom:0}
.net span{display:flex;align-items:center;gap:8px}
.net b{font-family:var(--serif);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.net small{font-size:10px;letter-spacing:.1em;color:var(--sub);margin-right:8px;font-family:inherit;font-weight:500}
.net .plus{color:var(--gold)}
.pays{margin-top:12px;padding-top:12px;border-top:1px solid var(--gold-l)}
.pays .p{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.pays .p i{flex:1;height:1px;background:var(--gold-l);position:relative;min-width:16px}
.pays .p i:after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid var(--gold);border-right:1px solid var(--gold);transform:rotate(45deg)}
.pays .p b{font-family:var(--serif);font-weight:500;font-size:15px;margin-left:6px}
/* ===== 宇宙テーマ ===== */
html[data-theme=space]{
  --pink:#8C7BFF;--pink-d:#B3A6FF;--white:rgba(255,255,255,.05);--petal:rgba(140,123,255,.14);--blush:#070B1F;
  --line:rgba(170,175,255,.18);--ink:#ECEEFF;--sub:#9AA2CC;--gold:#6FE7F2;--gold-l:#A99CFF;
  --serif:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;--orb:'Orbitron','Murecho','Hiragino Sans',sans-serif;
  color-scheme:dark;
}
html[data-theme=space],html[data-theme=space] body{background:#070B1F;color:var(--ink)}
html[data-theme=space] body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 8%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 42% 36%,#cfd6ff 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 22% 62%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 65% 72%,#bfefff 50%,transparent 51%),
   radial-gradient(1px 1px at 8% 88%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 52% 92%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 93% 82%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 12%,#fff 50%,transparent 51%),
   radial-gradient(600px 400px at 85% 30%,rgba(140,123,255,.18),transparent 70%),
   radial-gradient(500px 380px at 5% 75%,rgba(111,231,242,.10),transparent 70%),#070B1F;
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.75}to{opacity:1}}
html[data-theme=space] #app{background:transparent;z-index:1}
html[data-theme=space] .ticket{background:linear-gradient(160deg,#1A1550 0%,#2B1D6B 55%,#0F2A4A 100%);position:relative;overflow:hidden}
html[data-theme=space] .ticket::before{content:'';position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#B9AEFF,#5B47D6 55%,#1E1460 100%);opacity:.35;box-shadow:0 0 60px rgba(140,123,255,.5);pointer-events:none}
html[data-theme=space] .ticket::after{border-top:1px solid rgba(111,231,242,.35)}
html[data-theme=space] .ticket h1{font-family:var(--serif);font-weight:700;letter-spacing:.08em;text-shadow:0 0 18px rgba(169,156,255,.55)}
html[data-theme=space] .brand{color:var(--gold);letter-spacing:.2em}
html[data-theme=space] .stamp{border:1px solid rgba(111,231,242,.7);outline:1px dashed rgba(169,156,255,.5);outline-offset:5px;border-radius:50%;
  background:rgba(7,11,31,.35);box-shadow:0 0 22px rgba(111,231,242,.35),inset 0 0 14px rgba(111,231,242,.2)}
html[data-theme=space] .stamp b{font-family:var(--orb);font-weight:700;color:#fff;text-shadow:0 0 10px var(--gold)}
html[data-theme=space] .stamp small{color:var(--gold)}
html[data-theme=space] .who{border-color:rgba(111,231,242,.5);background:rgba(7,11,31,.3);border-radius:999px}
html[data-theme=space] .dnum,html[data-theme=space] .big,html[data-theme=space] .card-cost,html[data-theme=space] .net b,html[data-theme=space] .pays .p b,html[data-theme=space] .row .a,html[data-theme=space] .evtime{font-family:var(--orb);letter-spacing:.04em}
html[data-theme=space] .dnum{color:var(--gold);text-shadow:0 0 12px rgba(111,231,242,.5)}
html[data-theme=space] .big{color:#fff;text-shadow:0 0 14px rgba(140,123,255,.6)}
html[data-theme=space] .ddate::before{background:var(--gold)}
html[data-theme=space] .tl::before{background:linear-gradient(var(--gold),var(--pink));opacity:.6}
html[data-theme=space] .evdot{background:#0D1233;border-color:var(--gold-l);color:var(--gold);box-shadow:0 0 10px rgba(169,156,255,.4)}
html[data-theme=space] .evbody,html[data-theme=space] .card,html[data-theme=space] .panel,html[data-theme=space] .sub-panel,html[data-theme=space] .chk{
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html[data-theme=space] .ev.now .evbody{border-color:var(--gold);box-shadow:0 0 18px rgba(111,231,242,.25),inset 3px 0 0 var(--gold)}
html[data-theme=space] .chip{color:var(--gold-l);border-color:var(--line);border-radius:999px}
html[data-theme=space] .addrow{border-color:rgba(169,156,255,.4);color:var(--gold-l);border-radius:14px}
html[data-theme=space] .cat-h{color:var(--gold)}
html[data-theme=space] .sec-h,html[data-theme=space] .dayhead{border-bottom-color:var(--line)}
html[data-theme=space] .bar-t{background:rgba(255,255,255,.08);height:4px;border-radius:4px}
html[data-theme=space] .bar-t i{background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:4px;box-shadow:0 0 8px rgba(111,231,242,.5)}
html[data-theme=space] .net .plus{color:var(--gold)}
html[data-theme=space] .pays{border-top-color:var(--line)}
html[data-theme=space] .pays .p i{background:linear-gradient(90deg,var(--pink),var(--gold))}
html[data-theme=space] .pays .p i:after{border-color:var(--gold)}
html[data-theme=space] .av{background:#1A1550;color:var(--gold);border-color:var(--gold-l)}
html[data-theme=space] nav{background:rgba(9,13,38,.88);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
html[data-theme=space] nav button.on{color:var(--gold);text-shadow:0 0 10px rgba(111,231,242,.6)}
html[data-theme=space] .fab{background:linear-gradient(135deg,#8C7BFF,#4A9BFF);border-color:var(--gold);box-shadow:0 0 24px rgba(140,123,255,.6)}
html[data-theme=space] .tchips button,html[data-theme=space] .seg button{background:rgba(255,255,255,.04);color:var(--sub);border-color:var(--line)}
html[data-theme=space] .tchips button.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 0 12px rgba(140,123,255,.5)}
html[data-theme=space] .seg button.on{background:rgba(140,123,255,.18);color:#fff;border-color:var(--pink)}
html[data-theme=space] .sheet{background:#0E1335;color:var(--ink);border-top:1px solid var(--line)}
html[data-theme=space] input,html[data-theme=space] select,html[data-theme=space] textarea{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line)}
html[data-theme=space] input:focus,html[data-theme=space] textarea:focus,html[data-theme=space] select:focus{background:rgba(255,255,255,.08);border-color:var(--gold)}
html[data-theme=space] .btn{background:linear-gradient(135deg,#8C7BFF,#4A9BFF)}
html[data-theme=space] .thumbs button{border-color:var(--line)}
html[data-theme=space] .card.flash{animation:flashS 1.6s ease}
@keyframes flashS{0%,40%{box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(111,231,242,.6)}100%{box-shadow:none}}

/* 宇宙テーマ v2：銀河背景＋全体フォント */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
html[data-theme=space] body::before{display:none}
html[data-theme=space],html[data-theme=space] body,html[data-theme=space] button,html[data-theme=space] input,html[data-theme=space] textarea,html[data-theme=space] select{font-family:var(--orb)}
html[data-theme=space] .ticket h1,html[data-theme=space] .sec-h h2,html[data-theme=space] .card-name,html[data-theme=space] .evtitle,html[data-theme=space] .cat-h h3,html[data-theme=space] .sheet-h h2,html[data-theme=space] .welcome h1{font-family:var(--orb)}
html[data-theme=space] .ticket{background:linear-gradient(160deg,rgba(26,21,80,.82),rgba(43,29,107,.7) 55%,rgba(15,42,74,.75))}

html[data-theme=space] .evbody,html[data-theme=space] .card,html[data-theme=space] .panel,html[data-theme=space] .sub-panel,html[data-theme=space] .chk{background:rgba(8,10,34,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
html[data-theme=space] .addrow{background:rgba(8,10,34,.45)}

html[data-theme=space] .ticket::before{right:-40px;top:-50px;width:170px;height:170px;opacity:.9;
  background:
   radial-gradient(circle at 30% 38%,rgba(150,150,170,.35) 0 9%,transparent 10%),
   radial-gradient(circle at 58% 62%,rgba(150,150,170,.30) 0 7%,transparent 8%),
   radial-gradient(circle at 45% 28%,rgba(150,150,170,.25) 0 4%,transparent 5%),
   radial-gradient(circle at 66% 36%,rgba(150,150,170,.22) 0 5%,transparent 6%),
   radial-gradient(circle at 36% 70%,rgba(150,150,170,.22) 0 4%,transparent 5%),
   radial-gradient(circle at 40% 40%,#FFFFFF,#E9ECF5 45%,#B9BFD3 80%,#8E95AE 100%);
  box-shadow:0 0 40px rgba(255,255,255,.35),0 0 90px rgba(200,210,255,.25)}

html[data-theme=space] .ticket::before{right:-34px;top:-38px;width:120px;height:120px;opacity:.6;z-index:0}
html[data-theme=space] .ticket>*{position:relative;z-index:1}
html[data-theme=space] .ddate,html[data-theme=space] .sec-h .meta,html[data-theme=space] .dnum,html[data-theme=space] .sec-h h2,html[data-theme=space] .cat-h{text-shadow:0 0 6px #05071A,0 0 12px #05071A}

/* ===== アカウント・ホーム ===== */
body.sp #app{visibility:hidden}
#splash .sp-moon{display:none}
html[data-theme=space] #splash{background:transparent}
html[data-theme=space] #splash svg{display:none}
html[data-theme=space] #splash .sp-moon{display:block;width:84px;height:84px;border-radius:50%;opacity:0;animation:spIn .9s ease .1s forwards;
  background:radial-gradient(circle at 30% 38%,rgba(150,150,170,.35) 0 9%,transparent 10%),radial-gradient(circle at 58% 62%,rgba(150,150,170,.3) 0 7%,transparent 8%),radial-gradient(circle at 66% 36%,rgba(150,150,170,.22) 0 5%,transparent 6%),radial-gradient(circle at 40% 40%,#fff,#E9ECF5 45%,#B9BFD3 80%,#8E95AE);
  box-shadow:0 0 40px rgba(255,255,255,.35),0 0 90px rgba(200,210,255,.25)}
html[data-theme=space] #splash .t{font-family:var(--orb);text-shadow:0 0 18px rgba(169,156,255,.8)}
html[data-theme=space] #splash .r{background:linear-gradient(90deg,#8C7BFF,#6FE7F2)}
.hme{display:flex;align-items:center;gap:14px}
.hme small{display:block;font-size:11px;opacity:.75;letter-spacing:.12em}
.hme h1{margin:0}
.bell{position:relative}.bell i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#E8A35B;display:none}.bell.has i{display:block}
.back{margin-left:-10px}
.hrow .lft{display:flex;align-items:center;gap:2px;min-width:0}
.grp{margin:4px 0 28px}
.grp-h{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 10px;margin-bottom:12px;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.grp-h h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em;flex:1;min-width:0}
.grp-h .i{color:var(--sub)}
.mav{display:flex;padding-left:6px}.mav .av{margin-left:-6px;border:1.5px solid var(--blush)}
.hcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.hcard .t{flex:1;min-width:0}
.hcard b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.03em}
.hcard small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.mstamp{width:58px;height:58px;border-radius:50%;border:1px solid var(--gold-l);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.mstamp em{font-style:normal;font-size:9px;color:var(--sub);line-height:1.3}
.mstamp strong{font-family:var(--serif);font-size:20px;line-height:1.1;font-weight:600}
.htag{display:inline-block;font-size:10px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.dashed{display:block;width:100%;padding:12px;border:1px dashed var(--gold-l);border-radius:14px;color:var(--pink);font-weight:700;font-size:13px;letter-spacing:.06em;text-align:center}
.hempty{padding:28px 6px;color:var(--sub);font-size:13px;line-height:1.9;text-align:center}
.codebox{border:1px solid var(--gold-l);border-radius:16px;padding:20px;text-align:center;background:var(--white)}
.codebox small{display:block;font-size:11px;color:var(--sub);letter-spacing:.14em;margin-bottom:8px}
.codebox b{display:block;font-family:var(--serif);font-size:24px;letter-spacing:.1em;font-weight:600;color:var(--pink);margin-bottom:12px}
.frcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.frow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--petal)}
.frow:last-child{border-bottom:0}
.frow b{flex:1;font-weight:500;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .st{font-size:11px;color:var(--sub)}
.btn.xs{width:auto;padding:7px 14px;font-size:12px;margin:0;min-height:0;height:auto}
.btn.xs.ghost{border:1px solid var(--line)}
.photo{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skin{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--white);text-align:left;padding:0;position:relative;color:var(--ink)}
.skin.on{border:2px solid var(--gold);box-shadow:0 0 0 3px var(--petal)}
.skin .pv{height:110px;position:relative;overflow:hidden}
.skin .meta{padding:10px 12px 12px;display:block}
.skin .meta b{display:block;font-size:14px;font-weight:700}
.skin .meta small{font-size:11px;color:var(--sub)}
.skin .ok{position:absolute;top:8px;right:8px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;display:none}
.skin.on .ok{display:block}
.skin.lock{opacity:.5}
.pv-ryokan{background:#F7F6F2}
.pv-ryokan .h{height:46px;background:#3F5D63;padding:10px;color:#fff;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.1em}
.pv-ryokan .h:after{content:'';display:block;width:28px;height:1px;background:#A98F5B;margin-top:6px}
.pv-ryokan .c{margin:10px;height:36px;border-radius:8px;background:#fff;border:1px solid #DDE1DC}
.pv-space{background:radial-gradient(120px 80px at 70% 40%,rgba(140,123,255,.45),transparent 70%),radial-gradient(90px 70px at 20% 80%,rgba(111,231,242,.25),transparent 70%),radial-gradient(1px 1px at 20% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 35% 55%,#fff 50%,transparent 51%),#05071A}

nav .in.c3{grid-template-columns:repeat(3,1fr)}
.hhome .hme h1{font-size:24px;margin:0;line-height:1.3}

.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:-2px 0 24px;padding:18px;border-radius:18px;background:var(--white);border:1px solid var(--gold-l);box-shadow:0 6px 20px rgba(35,45,44,.07);color:var(--ink)}
.hero-l{flex:1;min-width:0}

.hsec{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.hsec h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.08em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:12px;font-weight:700;color:var(--pink)}

.gp-list{padding:2px 16px}

.tt small{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.trow.arch .dtile,.trow.arch .tt{opacity:.6}
.chip2{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--petal);color:var(--pink);white-space:nowrap;flex-shrink:0}

.gp-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--pink)}
.hempty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub)}
.hempty p{margin:0}
.slist{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--petal);text-align:left;color:var(--ink)}
.srow:last-child{border-bottom:0}

.srow-l{flex:1;font-size:14px;font-weight:500}

.btn.xs,.btn.sm{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.manual details{border-bottom:1px solid var(--line)}
.manual summary{display:flex;align-items:center;gap:12px;padding:13px 0;font-weight:700;font-size:14px;list-style:none;cursor:pointer}
.manual summary::-webkit-details-marker{display:none}
.manual summary>.i:last-child{margin-left:auto;color:var(--sub);transition:transform .2s}
.manual details[open] summary>.i:last-child{transform:rotate(90deg)}
.manual p{margin:0 0 14px 44px;font-size:13px;color:var(--sub);line-height:1.85}

function yen(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP');}
function pd(s){if(!s)return null;var a=s.split('-');if(a.length<3)return null;var d=new Date(+a[0],+a[1]-1,+a[2]);return isNaN(d)?null:d;}
function key(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
var WD='日月火水木金土';
function fday(d){return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）';}
function days(t){
  var s=pd(t.start),e=pd(t.end)||s,out=[];if(!s)return out;if(e<s)e=s;
  for(var d=new Date(s);d<=e&&out.length<60;d.setDate(d.getDate()+1))out.push(new Date(d));
  return out;
}
function today0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function isLink(a){return /^https?:\/\//i.test(String(a||'').trim());}

function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return cleanShare(u);}
function cleanShare(u){return u.replace(/([?&])g_st=[^&#]*&?/,'$1').replace(/[?&]$/,'');}
function host(u){try{return new URL(safeUrl(u)).hostname.replace(/^www\./,'');}catch(e){return 'リンク';}}

function driveId(u){u=String(u||'');var m=u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);return m?m[1]:'';}
function imgSrc(u){var id=driveId(u);if(id)return 'https://drive.google.com/thumbnail?id='+id+'&sz=w1600';return /^https:\/\/.+\.(jpe?g|png|webp|gif)(\?.*)?$/i.test(u)?u:'';}

function payerLabel(t,x){if(t.members.length<2)return '';return (!x.payer||x.payer==='split')?'割り勘':memName(t,x.payer);}
function settle(t){
  var net={};t.members.forEach(function(m){net[m.id]=0;});
  t.expenses.forEach(function(e){
    if(!e.tk)return;var fr=(e.for||[]).filter(function(id){return id!==e.owner&&net[id]!==undefined;});
    if(!fr.length||net[e.owner]===undefined)return;
    var amt=e.tAmount||e.amount||0,each=Math.floor(amt/fr.length),rest=amt-each*fr.length;
    net[e.owner]+=amt;fr.forEach(function(id,i){net[id]-=each+(i<rest?1:0);});
  });
  var pos=[],neg=[];Object.keys(net).forEach(function(id){if(net[id]>0)pos.push({id:id,v:net[id]});else if(net[id]<0)neg.push({id:id,v:-net[id]});});
  pos.sort(function(a,b){return b.v-a.v;});neg.sort(function(a,b){return b.v-a.v;});
  var pays=[],i=0,j=0;
  while(i<neg.length&&j<pos.length){var m=Math.min(neg[i].v,pos[j].v);pays.push({from:neg[i].id,to:pos[j].id,v:m});neg[i].v-=m;pos[j].v-=m;if(!neg[i].v)i++;if(!pos[j].v)j++;}
  return {net:net,pays:pays};
}

/* schedule */
function toMin(h){var a=(h||'0:0').split(':');return (+a[0])*60+(+a[1]);}
function todayPanel(t){
  var ds=days(t),td=key(today0()),idx=-1;
  ds.forEach(function(d,i){if(key(d)===td)idx=i;});
  if(idx<0)return '';
  var n=new Date(),hm=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
  var items=t.schedule.filter(function(x){return x.day===td&&x.time;}).sort(function(a,b){return a.time.localeCompare(b.time);});
  var next=null,now=null;items.forEach(function(x){if(x.time>hm){if(!next)next=x;}else now=x;});
  var h='<div class="today"><div class="today-h">本日　Day '+(idx+1)+'</div>';
  if(next){
    var df=toMin(next.time)-toMin(hm),left=df>=60?Math.floor(df/60)+'時間'+(df%60?(df%60)+'分':''):df+'分';
    var inf=next.infoId?infoById(t,next.infoId):null,addr=next.address||(inf&&inf.address)||'';
    h+='<div class="today-l">次の予定まで</div><div class="today-c">あと<b>'+left+'</b></div><div class="today-n"><span>'+esc(next.time)+'</span>'+esc(next.title)+'</div>'+
      (addr?'<div class="links">'+(isLink(addr)?'':'<a class="chip" href="'+esc('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr))+'" target="_blank" rel="noopener">'+ico('route',14)+'<span>ここから経路</span></a>')+'<a class="chip" href="'+esc(mapUrl(addr))+'" target="_blank" rel="noopener">'+ico('pin',14)+'<span>'+esc(addrLabel(addr))+'</span></a></div>':'');
  }else{
    var tm=ds[idx+1]?key(ds[idx+1]):'',first=t.schedule.filter(function(x){return x.day===tm&&x.time;}).sort(function(a,b){return a.time.localeCompare(b.time);})[0];
    h+='<div class="today-n" style="margin-top:10px">今日の予定はすべて終わりました</div>'+(first?'<div class="today-l">明日は '+esc(first.time)+' から「'+esc(first.title)+'」</div>':'');
  }
  if(now)h+='<div class="today-p">いまは「'+esc(now.title)+'」の時間です</div>';
  return h+'</div>';
}
function vSchedule(t){
  var ds=days(t),keys={},html='',td=key(today0()),n=new Date(),hm=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
  ds.forEach(function(d){keys[key(d)]=1;});
  ds.forEach(function(d,i){
    var k=key(d),items=t.schedule.filter(function(x){return x.day===k;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
    var nowId=null;
    if(k===td){items.forEach(function(x){if(x.time&&x.time<=hm)nowId=x.id;});}
    html+='<div class="day"><div class="dayhead"><span class="dnum">Day '+(i+1)+'</span><span class="ddate">'+fday(d)+'</span></div><div class="tl">'+
      items.map(function(x){return evHtml(t,x,x.id===nowId);}).join('')+'</div>'+
      (RO?'':'<button class="addrow" data-addday="'+k+'">'+ico('plus',16)+'予定を追加</button>')+'</div>';
  });
  var orphan=t.schedule.filter(function(x){return !keys[x.day];});
  if(orphan.length){
    html+='<div class="day"><div class="dayhead"><span class="dnum">期間外</span><span class="ddate">日付を直してください</span></div><div class="tl">'+orphan.map(function(x){return evHtml(t,x,false);}).join('')+'</div></div>';
  }
  if(!ds.length)html='<div class="empty">'+ico('cal',40)+'右上の設定から旅の日程を入れてください</div>';
  return todayPanel(t)+html;
}

        if(x.url)links+='<a class="chip" href="'+esc(safeUrl(x.url))+'" target="_blank" rel="noopener">'+ico('link',14)+'<span>'+esc(host(x.url))+'</span></a>';
        var pl=x.cost?payerLabel(t,x):'',im=(x.imgs||[]).filter(Boolean);
        return '<div class="card" data-iid="'+x.id+'" '+(RO?'':'data-info="'+x.id+'" role="button" tabindex="0"')+'><div class="card-top"><span class="card-name">'+esc(x.name)+'</span>'+
          (x.cost?'<span class="card-cost">'+yen(x.cost)+(pl?'<span class="payer">'+esc(pl)+'</span>':'')+'</span>':'')+'</div>'+r+
          (x.memo?'<div class="card-row" style="white-space:pre-wrap">'+esc(x.memo)+'</div>':'')+
          (links?'<div class="links">'+links+'</div>':'')+
          (im.length?'<div class="thumbs">'+im.map(function(u,k){var sr=imgSrc(u);return '<button type="button" data-noopen data-img="'+x.id+':'+k+'">'+(sr?'<img loading="lazy" alt="" src="'+esc(sr)+'" onerror="this.outerHTML=\'表示できません\'">':'画像を開く')+'</button>';}).join('')+'</div>':'')+'</div>';
      }).join('')+'</div>';
  }).join('');
}

/* money */
function dayLabel(t,k){var ds=days(t);for(var i=0;i<ds.length;i++)if(key(ds[i])===k)return 'Day '+(i+1)+' '+fday(ds[i]);return '';}
function forNames(t,e){return (e.for||[]).map(function(id){return memName(t,id);}).filter(Boolean).join('・');}
function vMoney(t){
  var plan=0,byCat={};
  t.info.forEach(function(x){if(x.cost){plan+=x.cost;byCat[x.cat||'other']=(byCat[x.cat||'other']||0)+x.cost;}});
  function barsOf(m,tot){return CATS.filter(function(c){return m[c.id];}).map(function(c){
    return '<div class="bar"><span>'+c.label+'</span><div class="bar-t"><i style="width:'+Math.max(4,m[c.id]/tot*100)+'%"></i></div><b>'+yen(m[c.id])+'</b></div>';}).join('');}
  var b1=barsOf(byCat,plan),bud='';
  if(t.members.length>=2&&plan){var pp={};t.members.forEach(function(m){pp[m.id]=0;});
    t.info.forEach(function(x){if(!x.cost)return;if(x.payer&&x.payer!=='split'&&pp[x.payer]!==undefined)pp[x.payer]+=x.cost;else t.members.forEach(function(m){pp[m.id]+=x.cost/t.members.length;});});
    bud='<div style="margin-top:12px">'+t.members.map(function(m){return '<div class="net"><span>'+avatar(t,m.id,20)+esc(m.name)+'</span><b><small>予算</small>'+yen(Math.round(pp[m.id]))+'</b></div>';}).join('')+'</div>';}
  var h='<div class="sec"><div class="sec-h"><h2>予定費用</h2><span class="meta">旅の情報から自動集計</span></div><div class="panel"><div class="cap">合計</div><div class="big">'+yen(plan)+'</div>'+bud+
    (b1?'<div class="bars">'+b1+'</div>':'<div class="hint" style="margin-top:6px">旅の情報に金額を入れるとここに集まります</div>')+'</div></div>';
  var w=whoOf(t),me=meOf(t);
  if(t.members.length)h+='<div class="sec" style="margin-bottom:18px"><div class="hint" style="margin:0 4px 8px">誰の家計簿を見る？</div><div class="tchips">'+
    t.members.map(function(m){return '<button data-who="'+m.id+'" class="mw'+(m.id===w?' on':'')+'">'+avatar(t,m.id,20)+esc(m.name)+(m.id===me?'（自分）':'')+'</button>';}).join('')+'</div></div>';
  var mine=t.expenses.filter(function(e){return w==='_'||e.owner===w;}).slice().sort(function(a,b){return (a.day||'').localeCompare(b.day||'');});
  var tot=0,mc={};mine.forEach(function(e){tot+=e.amount||0;mc[e.cat||'other']=(mc[e.cat||'other']||0)+(e.amount||0);});
  var b2=barsOf(mc,tot);
  h+='<div class="sec"><div class="sec-h"><h2>使ったお金</h2><span class="meta">'+(w==='_'?'':esc(memName(t,w))+'・')+mine.length+'件</span></div><div class="panel"><div class="cap">合計</div><div class="big">'+yen(tot)+'</div>'+
    (b2?'<div class="bars">'+b2+'</div>':'')+
    (mine.length?'<div style="margin-top:10px">'+mine.map(function(e){
      var sub=[dayLabel(t,e.day)];if(e.tk&&forNames(t,e))sub.push(esc(forNames(t,e))+'の分も立替');
      return '<button class="row" '+(RO?'disabled':'data-exp="'+e.id+'"')+'><span style="display:flex;gap:10px;align-items:center"><span style="color:var(--pink)">'+ico(catOf(e.cat).icon,20)+'</span><span><span class="t">'+esc(e.title||catOf(e.cat).label)+'</span>'+
        (sub.join('')?'<br><span class="s">'+sub.filter(Boolean).join('　')+'</span>':'')+'</span></span><span class="a">'+yen(e.amount)+'</span></button>';
    }).join('')+'</div>':'<div class="hint" style="margin-top:6px">'+(RO?'まだ記録はありません':'右下の＋から、使ったお金を記録できます')+'</div>')+'</div></div>';
  if(t.members.length>=2){
    var st=settle(t),any=st.pays.length;
    h+='<div class="sec"><div class="sec-h"><h2>精算</h2><span class="meta">立替の差し引き</span></div><div class="sub-panel">'+
      t.members.map(function(m){var n=st.net[m.id]||0;return '<div class="net"><span>'+avatar(t,m.id,20)+esc(m.name)+'</span><b class="'+(n>0?'plus':'')+'"><small>'+(n>0?'受け取る':n<0?'支払う':'')+'</small>'+(n>0?'+':n<0?'−':'')+yen(Math.abs(n))+'</b></div>';}).join('')+
      (any?'<div class="pays">'+st.pays.map(function(p){return '<div class="p"><span>'+esc(memName(t,p.from))+'</span><i></i><span>'+esc(memName(t,p.to))+'</span><b>'+yen(p.v)+'</b></div>';}).join('')+'</div>':'<div class="hint" style="padding:10px 0 2px">精算はありません</div>')+
      '</div></div>';
  }
  return h;
}

/* prep */
function whoOf(t){
  if(!t.members.length)return '_';
  var w=prepView[t.id]||meOf(t);
  if(!w||!memName(t,w))w=t.members[0].id;return w;
}
function meOf(t){var m=RO?roWho:((S.me||{})[t.id]);return memName(t,m)?m:'';}
function setMe(t,id){
  S.me=S.me||{};S.me[t.id]=id;save();
  prepView[t.id]='';
}
function isDone(x,w){return RO?!!sharedChecks[w+':'+x.id]:!!(x.checks&&x.checks[w]);}
function vPrep(t){
  var w=whoOf(t),me=meOf(t);
  // 持ち物（人ごと）
  var list=t.prep.items.filter(function(x){return w==='_'||!x.owner||x.owner===w;});
  var dn=list.filter(function(x){return isDone(x,w);}).length,pct=list.length?dn/list.length*100:0;
  var h='<div class="sec"><div class="sec-h"><h2>持ち物</h2><span class="meta">'+dn+' / '+list.length+'</span></div><div class="prog"><i style="width:'+pct+'%"></i></div>';
  if(t.members.length)h+='<div class="tchips" style="margin:0 0 14px">'+t.members.map(function(m){return '<button data-who="'+m.id+'" class="mw'+(m.id===w?' on':'')+'">'+avatar(t,m.id,20)+esc(m.name)+(m.id===me?'（自分）':'')+'</button>';}).join('')+'</div>';
  h+=list.map(function(x){var d=isDone(x,w);return '<div class="chk'+(d?' done':'')+'"><button class="box" data-chk="items:'+x.id+'" aria-label="'+esc(x.text)+'" aria-pressed="'+d+'">'+(d?ico('check',16):'')+'</button><button class="txt" data-chk="items:'+x.id+'">'+esc(x.text)+'</button>'+
    '<button class="del" data-delprep="items:'+x.id+'" aria-label="削除">'+ico('x',16)+'</button></div>';}).join('')+
    '<div class="addline"><input data-prepin="items" placeholder="'+(w!=='_'?esc(memName(t,w))+'の持ち物を追加':'持ち物を追加')+'"><button class="btn sm" data-prepadd="items">追加</button></div></div>';
  // やること（全員共通・担当者つき）
  var td=t.prep.todos,tdn=td.filter(function(x){return x.checks&&x.checks.all;}).length,tp=td.length?tdn/td.length*100:0;
  h+='<div class="sec"><div class="sec-h"><h2>やること</h2><span class="meta">'+tdn+' / '+td.length+'</span></div><div class="prog"><i style="width:'+tp+'%"></i></div>'+
    td.map(function(x){var d=!!(x.checks&&x.checks.all),an=memName(t,x.a);return '<div class="chk'+(d?' done':'')+'"><button class="box" data-chk="todos:'+x.id+'" aria-label="'+esc(x.text)+'" aria-pressed="'+d+'">'+(d?ico('check',16):'')+'</button><button class="txt" data-chk="todos:'+x.id+'">'+esc(x.text)+'</button>'+
      (t.members.length?'<button class="asg'+(an?'':' none')+'" data-asg="'+x.id+'">'+(an?avatar(t,x.a,16)+esc(an):'担当未定')+'</button>':'')+
      '<button class="del" data-delprep="todos:'+x.id+'" aria-label="削除">'+ico('x',16)+'</button></div>';}).join('')+
    '<div class="addline"><input data-prepin="todos" placeholder="予約などのやることを追加"><button class="btn sm" data-prepadd="todos">追加</button></div></div>';
  return h;
}

/* ---------- binding ---------- */
function qa(s){return Array.prototype.slice.call(app.querySelectorAll(s));}
function bind(t){
  qa('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;save();render();app.scrollTop=0;};});
  var f=document.getElementById('fab');
  if(f)f.onclick=function(){if(tab==='schedule')evSheet(t,null,days(t).length?key(days(t)[0]):'');else if(tab==='info')infoSheet(t,null);else if(tab==='money')expSheet(t,null);};
  var bs=document.getElementById('bShare');if(bs)bs.onclick=function(){shareTrip(t);};
  var bt=document.getElementById('bSet');if(bt)bt.onclick=function(){setSheet(t);};
  qa('[data-addday]').forEach(function(b){b.onclick=function(){evSheet(t,null,b.dataset.addday);};});
  qa('[data-ev]').forEach(function(b){tapOpen(b,function(){evSheet(t,find(t.schedule,b.dataset.ev));});});
  qa('[data-info]').forEach(function(b){tapOpen(b,function(){infoSheet(t,find(t.info,b.dataset.info));});});
  qa('[data-img]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var p=b.dataset.img.split(':'),x=find(t.info,p[0]);if(x&&x.imgs)openLb(x.imgs[+p[1]]);};});
  qa('[data-goinfo]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.dataset.goinfo;tab='info';save();render();
    var c=app.querySelector('[data-iid="'+id+'"]');if(c){c.scrollIntoView({block:'center'});c.classList.add('flash');}};});
  qa('[data-exp]').forEach(function(b){b.onclick=function(){expSheet(t,find(t.expenses,b.dataset.exp));};});
  qa('[data-chk]').forEach(function(b){b.onclick=function(){
    var p=b.dataset.chk.split(':'),x=find(t.prep[p[0]],p[1]);if(!x)return;
    var w=p[0]==='todos'?'all':whoOf(t);
    if(RO){var k=w+':'+x.id;sharedChecks[k]=!sharedChecks[k];try{localStorage.setItem('shiori_chk_'+t.id,JSON.stringify(sharedChecks));}catch(e){}}
    else{x.checks=x.checks||{};x.checks[w]=!x.checks[w];save();}
    render();
  };});
  qa('[data-delprep]').forEach(function(b){b.onclick=function(){var p=b.dataset.delprep.split(':');t.prep[p[0]]=t.prep[p[0]].filter(function(x){return x.id!==p[1];});save();render();};});
  qa('[data-prepadd]').forEach(function(b){
    var g=b.dataset.prepadd,inp=app.querySelector('[data-prepin="'+g+'"]');
    function add(){var v=inp.value.trim();if(!v)return;var w=whoOf(t);t.prep[g].push(g==='items'?{id:uid(),text:v,owner:w!=='_'?w:'',checks:{}}:{id:uid(),text:v,owner:'',a:'',checks:{}});save();render();var n=app.querySelector('[data-prepin="'+g+'"]');if(n)n.focus();}
    b.onclick=add;inp.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add();}};
  });
  qa('[data-who]').forEach(function(b){b.onclick=function(){
    prepView[t.id]=b.dataset.who;render();
  };});
  qa('[data-asg]').forEach(function(b){b.onclick=function(){
    var x=find(t.prep.todos,b.dataset.asg);if(!x)return;
    openSheet('担当を決める','<p class="hint" style="margin:0 0 12px">「'+esc(x.text)+'」の担当</p><div class="tchips"><button data-a="" class="'+(!x.a?'on':'')+'">未定</button>'+
      t.members.map(function(m){return '<button data-a="'+m.id+'" class="'+(x.a===m.id?'on':'')+'">'+esc(m.name)+'</button>';}).join('')+'</div>',function(el){
      el.querySelectorAll('[data-a]').forEach(function(c){c.onclick=function(){x.a=c.dataset.a;save();closeSheet();render();};});
    });
  };});
    var bw=document.getElementById('bWho');if(bw)bw.onclick=function(){whoSheet(t);};
}
function delMember(t,id){
  var used=t.expenses.some(function(e){return e.owner===id||(e.for||[]).indexOf(id)>=0;});
  var own=t.prep.items.concat(t.prep.todos).some(function(x){return x.owner===id;});
  if((used||own)&&!confirm(memName(t,id)+'の支払い記録や個人の準備リストが含まれています。削除しますか？'))return false;
  t.prep.items=t.prep.items.filter(function(x){return x.owner!==id;});t.prep.todos=t.prep.todos.filter(function(x){return x.owner!==id;});
  t.members=t.members.filter(function(m){return m.id!==id;});t.av=t.av.filter(function(a){return a.id!==id;});t.prep.todos.forEach(function(x){if(x.a===id)x.a='';});
  t.expenses=t.expenses.filter(function(e){return e.owner!==id;});t.expenses.forEach(function(e){e.for=(e.for||[]).filter(function(x){return x!==id;});if(!e.for.length)e.tk=false;});
  if(S.me&&S.me[t.id]===id)delete S.me[t.id];
  save();return true;
}
function tapOpen(el,fn){el.addEventListener('click',function(e){if(e.target.closest('a,[data-noopen]'))return;fn();});el.addEventListener('keydown',function(e){if(e.key==='Enter')fn();});}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}

/* ---------- sheets ---------- */
function openSheet(title,html,mount){
  closeSheet();
  var bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet" role="dialog" aria-label="'+esc(title)+'"><div class="grab"></div><div class="sheet-h"><h2>'+esc(title)+'</h2><button class="ib" data-close aria-label="閉じる">'+ico('x',20)+'</button></div><div class="sheet-b">'+html+'</div></div>';
  document.body.appendChild(bg);
  requestAnimationFrame(function(){bg.classList.add('on');});
  bg.addEventListener('click',function(e){if(e.target===bg||e.target.closest('[data-close]'))closeSheet();});
  if(mount)mount(bg.querySelector('.sheet-b'));
}
function closeSheet(){var b=document.querySelector('.sheet-bg');if(b)b.remove();if(pending)setTimeout(function(){if(pending&&canApply())applyResp(pending);},0);}
function fld(label,inner){return '<label class="f"><span>'+label+'</span>'+inner+'</label>';}
function v(el,s){return el.querySelector(s).value.trim();}

function evSheet(t,x,dayKey){
  var isNew=!x;x=x||{type:'spot',day:dayKey};
  var ds=days(t),opts=ds.map(function(d,i){var k=key(d);return '<option value="'+k+'"'+(k===x.day?' selected':'')+'>Day '+(i+1)+'　'+fday(d)+'</option>';}).join('');
  if(x.day&&!ds.some(function(d){return key(d)===x.day;}))opts+='<option value="'+esc(x.day)+'" selected>期間外（'+esc(x.day)+'）</option>';
  var infOpts='<option value="">紐付けない</option>'+CATS.map(function(c){
    var l=t.info.filter(function(i){return (i.cat||'other')===c.id;});
    return l.length?'<optgroup label="'+c.label+'">'+l.map(function(i){return '<option value="'+i.id+'"'+(i.id===x.infoId?' selected':'')+'>'+esc(i.name)+'</option>';}).join('')+'</optgroup>':'';
  }).join('');
  var html=fld('予定名','<input id="fT" value="'+esc(x.title||'')+'" placeholder="例：清水寺を散策">')+
    '<div class="two">'+fld('開始','<input id="fTime" type="time" value="'+esc(x.time||'')+'">')+fld('終了（任意）','<input id="fEnd" type="time" value="'+esc(x.end||'')+'">')+'</div>'+
    fld('日にち','<select id="fDay">'+opts+'</select>')+
    '<label class="f"><span>種類</span><div class="seg" id="fType">'+CATS.map(function(c){return '<button type="button" data-v="'+c.id+'" class="'+(x.type===c.id?'on':'')+'">'+ico(c.icon,18)+c.label+'</button>';}).join('')+'</div></label>'+
    (t.info.length?fld('旅の情報と紐付け','<select id="fInfo">'+infOpts+'</select>'):'')+
    fld('住所','<input id="fAddr" value="'+esc(x.address||'')+'" placeholder="紐付けた情報に住所があれば空欄でOK">')+
    fld('URL','<input id="fUrl" type="url" inputmode="url" value="'+esc(x.url||'')+'" placeholder="https://">')+
    fld('メモ','<textarea id="fMemo">'+esc(x.memo||'')+'</textarea>')+
    '<button class="btn" id="fSave">'+(isNew?'追加する':'保存する')+'</button>'+(isNew?'':'<button class="btn danger" id="fDel">'+ico('trash',18)+'この予定を削除</button>');
  openSheet(isNew?'予定を追加':'予定を編集',html,function(el){
    var type=x.type;
    el.querySelectorAll('#fType button').forEach(function(b){b.onclick=function(){type=b.dataset.v;el.querySelectorAll('#fType button').forEach(function(o){o.classList.toggle('on',o===b);});};});
    el.querySelector('#fSave').onclick=function(){
      var title=v(el,'#fT');if(!title){toast('予定名を入れてください');return;}
      var o={title:title,time:v(el,'#fTime'),end:v(el,'#fEnd'),day:el.querySelector('#fDay').value,type:type,
        infoId:el.querySelector('#fInfo')?el.querySelector('#fInfo').value:'',address:v(el,'#fAddr'),url:v(el,'#fUrl'),memo:v(el,'#fMemo')};
      if(isNew){o.id=uid();t.schedule.push(o);}else Object.assign(x,o);
      save();closeSheet();render();toast(isNew?'追加しました':'保存しました');
    };
    var d=el.querySelector('#fDel');if(d)d.onclick=function(){if(!confirm('この予定を削除しますか？'))return;t.schedule=t.schedule.filter(function(i){return i.id!==x.id;});save();closeSheet();render();toast('削除しました');};
  });
}

function infoSheet(t,x){

    fld('アクセス','<input id="fAcc" value="'+esc(x.access||'')+'" placeholder="例：京都駅から市バス206系統で15分">')+

    '<div class="note">ドライブの共有設定を「リンクを知っている全員」にしてからURLをコピーしてください</div>'+

  openSheet(isNew?'旅の情報を追加':'旅の情報を編集',html,function(el){

function pickImage(cb){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      function draw(px,q){var c=document.createElement('canvas');c.width=c.height=px;var g=c.getContext('2d'),m=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,px,px);return c.toDataURL('image/jpeg',q);}
      var d=draw(144,.8),q=.8;while(d.length>8000&&q>.35){q-=.1;d=draw(144,q);}
      if(d.length>8000)d=draw(96,.6);
      URL.revokeObjectURL(url);cb(d);};
    img.onerror=function(){toast('この画像は読み込めませんでした');};img.src=url;};
  inp.click();
}

function migCard(tid,r){

  return '<div class="mig" data-mig="'+tid+'" data-hasg="'+(r.hasGroup?1:0)+'"><h3>'+esc(r.title||'しおり')+'</h3><div class="note" style="margin:0 0 12px">'+esc((r.start||'').replace(/-/g,'/'))+'</div>'+
    (free.length?'<label class="f"><span>このしおりの中のあなたは？</span><div class="tchips">'+free.map(function(m){return '<button data-mid="'+m.id+'">'+esc(m.name)+'</button>';}).join('')+'</div></label>'+
      (r.hasGroup?'<div class="note">すでにグループがあるので、そこに入ります</div>':fld('グループ名','<input class="gnm" maxlength="20" placeholder="例：家族旅行">'))+
      '<button class="btn" data-claim>引き継ぐ</button>':'<div class="note">全員が引き継ぎ済みです</div>')+'</div>';
}
function bindMig(box){
  box.querySelectorAll('.mig').forEach(function(c){
    var mid='';
    c.querySelectorAll('[data-mid]').forEach(function(b){b.onclick=function(){mid=b.dataset.mid;c.querySelectorAll('[data-mid]').forEach(function(o){o.classList.toggle('on',o===b);});};});
    var go=c.querySelector('[data-claim]');if(!go)return;
    go.onclick=function(){
      if(!mid){toast('あなたを選んでください');return;}
      var g=c.querySelector('.gnm'),gn=g?g.value.trim():'';
      if(g&&!gn){toast('グループ名を入れてください');g.focus();return;}
      go.disabled=true;go.textContent='引き継ぎ中…';
      accApi({a:'claim',tid:c.dataset.mig,mid:mid,gname:gn}).then(function(){
        S.me=S.me||{};S.me[c.dataset.mig]=mid;
        S.known=S.known.filter(function(x){return x.id!==c.dataset.mig;});if(!S.known.length)S.migrated=true;savePrefs();
        c.classList.add('done');c.innerHTML='<h3>引き継ぎました</h3><div class="note" style="margin:0">ホームのグループから開けます</div>';
        if(c.closest('.sheet')){closeSheet();toast('引き継ぎました');goHome();return;}
        if(S.migrated){toast('引き継ぎが完了しました');setTimeout(goHome,700);}
      }).catch(function(e){go.disabled=false;go.textContent='引き継ぐ';toast(e.message);});
    };
  });
}

/* ホーム */
function goHome(){VIEW='home';T=null;base=null;ARCH=false;S.last=null;savePrefs();
  try{history.replaceState(null,'',location.href.split(/[?#]/)[0]);}catch(e){}
  if(ACC)renderHome();loadMe().then(function(){if(VIEW==='home'&&canHome())renderHome();}).catch(function(e){if(!ACC)renderHomeErr(e);});}
function canHome(){var a=document.activeElement;return !document.querySelector('.sheet-bg')&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));}
function renderHomeErr(e){app.innerHTML='<div class="welcome"><h1>旅のしおり</h1><p>'+esc(e&&e.message==='アカウントが見つかりません'?'アカウントが見つかりませんでした。':'接続できませんでした。電波を確認してください。')+'</p><button class="btn" id="fRe">もう一度読み込む</button></div>';
  document.getElementById('fRe').onclick=goHome;}
function mstamp(x){
  if(x.arch)return '<span class="htag">思い出</span>';
  var s=pd(x.start),e=pd(x.end)||s,td=today0();if(!s)return '';
  var d=Math.round((s-td)/864e5);
  if(d>0)return '<span class="mstamp"><em>出発まで</em><strong>'+d+'</strong><em>日</em></span>';
  if(td<=e)return '<span class="mstamp"><em>旅行中</em><strong>'+(Math.round((td-s)/864e5)+1)+'</strong><em>日目</em></span>';
  return '<span class="htag">おかえり</span>';
}
function rangeTxt(x){var s=pd(x.start),e=pd(x.end);if(!s)return '';return fday(s)+(e&&x.end!==x.start?' 〜 '+fday(e):'');}
function todayTxt(){var d=today0();return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';}
function tripStatus(x){
  if(x.arch)return '<span class="chip2 mute">'+ico('archive',13)+'思い出</span>';
  var s=pd(x.start),e=pd(x.end)||s,td=today0();if(!s)return '';
  var d=Math.round((s-td)/864e5);
  if(d>0)return '<span class="chip2">あと'+d+'日</span>';
  if(td<=e)return '<span class="chip2 live">旅行中</span>';
  return '<span class="chip2 mute">おかえり</span>';
}
function nextTrip(){var best=null,td=today0();
  ACC.groups.forEach(function(g){g.trips.forEach(function(x){if(x.arch)return;var s=pd(x.start),e=pd(x.end)||s;if(!s||e<td)return;
    if(!best||s<best.s)best={x:x,g:g,s:s,e:e};});});return best;}
function renderHome(){
  if(!ACC)return;VIEW='home';var me=ACC.me;
  var h='<header class="ticket hhome"><div class="hrow"><span class="brand">旅のしおり</span><div class="hbtns"><button class="hbtn bell'+(ACC.incoming.length?' has':'')+'" id="hBell" aria-label="お知らせ">'+ico('bell',22)+'<i></i></button></div></div>'+
    '<div class="hmain"><div class="hme">'+pAv(me,52)+'<div><h1>'+esc(me.name)+'</h1><small>'+todayTxt()+'</small></div></div></div></header><main id="main">';
  if(HV==='friends')h+=hFriends();else if(HV==='settings')h+=hSettings();else h+=hTrips();
  h+='</main><nav><div class="in c3">'+[['trips','しおり','book'],['friends','フレンド','people'],['settings','設定','sliders']].map(function(x){
    return '<button data-hv="'+x[0]+'" class="'+(HV===x[0]?'on':'')+'">'+ico(x[2],22)+x[1]+(x[0]==='friends'&&ACC.incoming.length?'<i class="ndot"></i>':'')+'</button>';}).join('')+'</div></nav>';
  var y=app.scrollTop;app.innerHTML=h;app.scrollTop=y;bindHome();
}
function hTrips(){
  var h='',nx=nextTrip();
  if(nx){var d=Math.round((nx.s-today0())/864e5),live=d<=0;
    h+='<button class="hero" data-open="'+nx.x.tid+'"><span class="hero-l"><small>'+ico('cal',14)+(live?'旅行中':'次の旅')+'・'+esc(nx.g.name)+'</small><b>'+esc(nx.x.title||'しおり')+'</b><em>'+rangeTxt(nx.x)+'</em></span>'+
      '<span class="hero-r"><strong>'+(live?Math.round((today0()-nx.s)/864e5)+1:d)+'</strong><em>'+(live?'日目':'日後')+'</em></span></button>';}
  h+='<div class="hsec"><h2>グループ</h2><button class="pill" id="hNewG">'+ico('plus',15)+'グループを作る</button></div>';
  if(!ACC.groups.length)h+='<div class="hempty"><span class="emp"></span><p>まだグループがありません。<br>グループを作ると、その中でしおりを作れます。<br>一緒に旅する人は「フレンド」から追加できます。</p></div>';
  ACC.groups.forEach(function(g){
    var act=g.trips.filter(function(x){return !x.arch;}),arc=g.trips.filter(function(x){return x.arch;});
    h+='<section class="gp"><button class="gp-h" data-grp="'+g.gid+'"><span class="gp-ic">'+ico('people',18)+'</span><span class="gp-t"><b>'+esc(g.name)+'</b><small>'+g.members.length+'人・しおり'+g.trips.length+'件</small></span><span class="mav">'+g.members.slice(0,4).map(function(m){return pAv(m,24);}).join('')+'</span>'+ico('chev',16)+'</button>'+
      '<div class="gp-list">'+(g.trips.length?act.concat(arc).map(function(x){var sd=pd(x.start);
        return '<button class="trow'+(x.arch?' arch':'')+'" data-open="'+x.tid+'"><span class="dtile">'+(sd?'<em>'+(sd.getMonth()+1)+'月</em><strong>'+sd.getDate()+'</strong>':'<em>未定</em>')+'</span><span class="tt"><b>'+esc(x.title||'しおり')+'</b><small>'+rangeTxt(x)+'</small></span>'+tripStatus(x)+'</button>';}).join(''):'<div class="gp-empty"><span class="emp sm"></span>まだしおりがありません</div>')+'</div>'+
      '<button class="gp-add" data-nt="'+g.gid+'">'+ico('plus',16)+'このグループでしおりを作る</button></section>';
  });
  return h;
}

function bindHome(){
  function on(id,fn){var el=document.getElementById(id);if(el)el.onclick=fn;}
  qa('[data-hv]').forEach(function(b){b.onclick=function(){HV=b.dataset.hv;app.scrollTop=0;renderHome();};});
  on('hBell',function(){HV='friends';app.scrollTop=0;renderHome();});
  qa('[data-open]').forEach(function(b){b.onclick=function(){openTrip(b.dataset.open);};});
  qa('[data-grp]').forEach(function(b){b.onclick=function(){groupSheet(b.dataset.grp);};});
  qa('[data-nt]').forEach(function(b){b.onclick=function(){newTripSheet(b.dataset.nt);};});
  on('hNewG',newGroupSheet);
  on('hCopy',function(){var c=ACC.me.code;if(navigator.clipboard)navigator.clipboard.writeText(c).then(function(){toast('コピーしました');});else prompt('合言葉',c);});
  on('hReq',function(){var i=document.getElementById('hCode'),c=i.value.trim();if(!c){toast('合言葉を入れてください');return;}
    accApi({a:'friendReq',code:c}).then(function(){i.value='';renderHome();toast('申請しました');}).catch(function(e){toast(e.message);});});
  qa('[data-fok]').forEach(function(b){b.onclick=function(){var n=(ROSTER[b.dataset.fok]||{}).name||'';accApi({a:'friendRes',uid:b.dataset.fok,ok:true}).then(function(){renderHome();toast(n+'さんとフレンドになりました');}).catch(function(e){toast(e.message);});};});
  qa('[data-fng]').forEach(function(b){b.onclick=function(){accApi({a:'friendRes',uid:b.dataset.fng,ok:false}).then(renderHome).catch(function(e){toast(e.message);});};});

}

function bindPick(el,store){el.querySelectorAll('[data-pk]').forEach(function(b){b.onclick=function(){store[b.dataset.pk]=!store[b.dataset.pk];b.classList.toggle('on',!!store[b.dataset.pk]);};});}
