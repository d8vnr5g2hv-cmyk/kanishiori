  openSheet('プロフィール','<div class="photo"><span id="pAv">'+pAv(me,72)+'</span><div style="display:flex;flex-direction:column;gap:8px"><button class="btn ghost xs" id="pPic">写真を選ぶ</button>'+(me.img?'<button class="btn ghost xs" id="pRm">写真を外す</button>':'')+'</div></div>'+
    fld('名前','<input id="pNm" maxlength="20" value="'+esc(me.name)+'" placeholder="例：耀平">')+'<button class="btn" id="pGo">保存する</button>',function(el){
    function pv(){el.querySelector('#pAv').innerHTML=pAv({name:v(el,'#pNm')||me.name,img:img},72);}
    el.querySelector('#pPic').onclick=function(){pickImage(function(d){img=d;cl=true;pv();});};
    var rm=el.querySelector('#pRm');if(rm)rm.onclick=function(){img='';cl=true;pv();};
    el.querySelector('#pGo').onclick=function(){var n=v(el,'#pNm');if(!n){toast('名前を入れてください');return;}var body={a:'profile',name:n};if(cl)body.img=img;
      accApi(body).then(function(){closeSheet();renderHome();toast('保存しました');}).catch(function(e){toast(e.message);});};
  });
}
function skinSheet(){
  function pv(t){if(t.lock)return '<div class="pv pv-soon">COMING SOON</div>';
    if(t.pv)return '<div class="pv" style="background:'+t.pv.bg+'"><div class="h" style="background:'+t.pv.head+';font-family:'+t.pv.font+'">旅のしおり</div><div class="c"></div></div>';
    if(t.id==='space')return '<div class="pv pv-space"><div class="mn"></div><div class="h">旅のしおり</div><div class="c"></div></div>';return '<div class="pv pv-ryokan"><div class="h">旅のしおり</div><div class="c"></div></div>';}
  openSheet('着せ替え','<div class="hint" style="margin:0 0 14px">選ぶとすぐに切り替わります。スプラッシュ画面も着せ替えに合わせて変わります。このスマホだけに反映されます。</div><div class="skins">'+
    THEMES.map(function(t){return '<button class="skin'+(t.id===S.theme?' on':'')+(t.lock?' lock':'')+'" data-skin="'+t.id+'"'+(t.lock?' disabled':'')+'>'+pv(t)+'<span class="ok">使用中</span><span class="meta"><b>'+t.name+'</b><small>'+t.desc+'</small></span></button>';}).join('')+'</div>',function(el){
    el.querySelectorAll('[data-skin]').forEach(function(b){b.onclick=function(){if(b.disabled||b.dataset.skin===S.theme)return;applyTheme(b.dataset.skin);closeSheet();renderHome();showSplash(1300);};});
  });
}

/* しおりの中：アカウントとの紐づけ */
function myMid(t){if(!ACC||!t)return '';for(var i=0;i<t.members.length;i++)if(t.members[i].uid===ACC.me.uid)return t.members[i].id;return '';}
function syncMe(t){var m=myMid(t);if(m){S.me=S.me||{};S.me[t.id]=m;}}
function claimSheet(t){
  var free=t.members.filter(function(m){return !m.uid;});if(!free.length)return;
  openSheet('このしおりの中のあなたは？','<p class="hint" style="margin:0 0 14px">以前からこのしおりを使っていた場合は、自分を選ぶとアカウントと紐づきます。</p><div class="tchips" style="margin-bottom:16px">'+
    free.map(function(m){return '<button data-cm="'+m.id+'">'+esc(m.name)+'</button>';}).join('')+'</div><button class="btn ghost" data-close>どれでもない</button>',function(el){
    el.querySelectorAll('[data-cm]').forEach(function(b){b.onclick=function(){accApi({a:'claim',tid:t.id,mid:b.dataset.cm}).then(function(){closeSheet();toast('紐づけました');openTrip(t.id);}).catch(function(e){toast(e.message);});};});
  });
}
function archBar(){return ARCH?'<div class="archbar">思い出として保管されたしおりです（閲覧のみ）。<div class="btns"><button class="btn xs" id="aRes">編集できる状態に戻す</button><button class="btn xs ghost" id="aJson">JSONで保存</button></div></div>':'';}
function bindArch(t){
  var r=document.getElementById('aRes');if(r)r.onclick=function(){if(!confirm('編集できる状態に戻しますか？'))return;accApi({a:'restore',tid:t.id}).then(function(){toast('戻しました');openTrip(t.id);}).catch(function(e){toast(e.message);});};
  var j=document.getElementById('aJson');if(j)j.onclick=function(){
    var name=(t.title||'shiori')+'.json',blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'});
    try{var f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:t.title}).catch(function(){});return;}}catch(e){}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);};
}

/* ---------- sync (GAS) ---------- */
var COLL=[['sch',function(t){return t.schedule;}],['inf',function(t){return t.info;}],['exp',function(t){return t.expenses;}],['items',function(t){return t.prep.items;}],['todos',function(t){return t.prep.todos;}],['av',function(t){return t.av;}]];
function cleanItem(k,x){var o={};Object.keys(x).sort().forEach(function(p){if(!((k==='items'||k==='todos')&&p==='checks'))o[p]=x[p];});return o;}
function diff(b,t){
  var ops=[];
  var mt=JSON.stringify({title:t.title,start:t.start,end:t.end,members:t.members});
  var mb=b?JSON.stringify({title:b.title,start:b.start,end:b.end,members:b.members}):'';
  if(mb!==mt)ops.push({op:'meta',v:JSON.parse(mt)});
  COLL.forEach(function(c){
    var k=c[0],bl=b?c[1](b):[],tl=c[1](t),bm={},tm={};
    bl.forEach(function(x){bm[x.id]=x;});
    tl.forEach(function(x,i){
      if(!x.c)x.c=Date.now()+i;tm[x.id]=1;
      var s=JSON.stringify(cleanItem(k,x));
      if(!bm[x.id]||JSON.stringify(cleanItem(k,bm[x.id]))!==s)ops.push({op:'put',k:k,id:x.id,v:cleanItem(k,x)});
      if(k==='items'||k==='todos'){
        var bc=(bm[x.id]&&bm[x.id].checks)||{},tc=x.checks||{},all={};
        Object.keys(bc).concat(Object.keys(tc)).forEach(function(m){all[m]=1;});
        Object.keys(all).forEach(function(m){if(!!bc[m]!==!!tc[m])ops.push({op:'chk',id:x.id,m:m,on:!!tc[m]});});
      }
    });
    bl.forEach(function(x){if(!tm[x.id])ops.push({op:'del',k:k,id:x.id});});
  });
  return ops;
}
function build(id,d){
  var m=d.meta||{},chk=d.chk||{};
  function pc(l){return (l||[]).map(function(x){x.checks=chk[x.id]||{};return x;});}
  return norm({id:id,title:m.title||'',start:m.start||'',end:m.end||'',members:m.members||[],
    av:d.av||[],schedule:d.sch||[],info:d.inf||[],expenses:d.exp||[],prep:{items:pc(d.items),todos:pc(d.todos)}});
}
function getJSON(api,q,ms){var ac=window.AbortController?new AbortController():null,tm=ac?setTimeout(function(){ac.abort();},ms||15000):0;return fetch(api+(api.indexOf('?')>=0?'&':'?')+q,{cache:'no-store',signal:ac?ac.signal:undefined}).then(function(r){clearTimeout(tm);return r.json();},function(e){clearTimeout(tm);throw e;});}
function postJSON(body){body.k=S.key;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
var syncSt='';
function avatar(t,id,sz){sz=sz||22;var a=find(t.av||[],id),n=memName(t,id)||'?',m=find(t.members||[],id),r=m&&m.uid&&ROSTER[m.uid],im=(r&&r.img)||(a&&a.img)||'';
  return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.46)+'px">'+(im?'<img src="'+esc(im)+'" alt="">':esc(n.charAt(0)))+'</span>';}
function pickAvatar(t,id){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      function draw(px,q){var c=document.createElement('canvas');c.width=c.height=px;var g=c.getContext('2d'),m=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,px,px);return c.toDataURL('image/jpeg',q);}
      var d=draw(120,.8),q=.8;while(d.length>7000&&q>.35){q-=.1;d=draw(120,q);}
      if(d.length>7000)d=draw(80,.6);
      URL.revokeObjectURL(url);
      var a=find(t.av,id);if(a)a.img=d;else t.av.push({id:id,img:d});
      save();closeSheet();render();toast('写真を設定しました');
    };
    img.onerror=function(){toast('この画像は読み込めませんでした');};
    img.src=url;
  };
  inp.click();
}
function avSheet(t,id){
  var a=find(t.av,id);
  openSheet(memName(t,id)+' の写真','<div style="display:flex;justify-content:center;margin:4px 0 18px">'+avatar(t,id,96)+'</div><button class="btn" id="fPick">写真を選ぶ</button>'+(a?'<button class="btn danger" id="fRm">写真を外す</button>':''),function(el){
    el.querySelector('#fPick').onclick=function(){pickAvatar(t,id);};
    var rm=el.querySelector('#fRm');if(rm)rm.onclick=function(){t.av=t.av.filter(function(x){return x.id!==id;});save();closeSheet();render();};
  });
}
function onlineHtml(){if(!T||!onlineIds.length)return '';return '<i class="dot"></i>'+onlineIds.map(function(id){return avatar(T,id,18);}).join('')+'<span>'+esc(onlineIds.map(function(id){return memName(T,id);}).join('、'))+' が見ています</span>';}
function setOnline(r){
  if(!T||!r||!r.online)return;var me=meOf(T),now=r.now||Date.now();
  onlineIds=T.members.filter(function(m){return m.id!==me&&r.online[m.id]&&now-r.online[m.id]<45000;}).map(function(m){return m.id;});
  var el=document.getElementById('online');if(el)el.innerHTML=onlineHtml();
}
function meQ(id){var m=(S.me||{})[id];return m?'&m='+encodeURIComponent(m):'';}
function setSync(s){
  syncSt=s;var el=document.querySelector('.brand');if(!el)return;
  var n=new Date(),hm=n.getHours()+':'+('0'+n.getMinutes()).slice(-2);
  el.textContent=s==='saving'?'保存中…':s==='err'?'オフライン（あとで保存します）':s==='ok'?'同期済み '+hm:'旅のしおり';
}
function flush(){
  if(busy||!queue.length)return;busy=true;setSync('saving');
  var job=queue[0];
  postJSON(job).then(function(r){
    if(!r||r.error)throw r&&r.error;
    queue.shift();busy=false;
    if(T&&job.t===T.id&&!queue.length&&r.data)applyResp(r);
    setSync('ok');flush();
  }).catch(function(){busy=false;setSync('err');setTimeout(flush,5000);});
}
function canApply(){var a=document.activeElement;return !document.querySelector('.sheet-bg')&&!(a&&app.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));}
function applyResp(r){
  if(!r||r.same||!r.data)return;
  if(!r.data.meta){notFound();return;}
  if(busy||queue.length)return;
  if(!canApply()){pending=r;return;}
  pending=null;rev=r.rev;T=build(T.id,r.data);syncMe(T);base=clone(T);
  savePrefs();
  var y=app.scrollTop;render();app.scrollTop=y;
}
function notFound(){T=null;base=null;toast('このしおりは見つかりませんでした');goHome();}
function openTrip(id){
  VIEW='trip';S.last=id;T=null;base=null;rev=0;pending=null;loadErr=false;ARCH=false;tab=tab||'schedule';savePrefs();render();
  getJSON(API,'a=get&t='+encodeURIComponent(id)+'&k='+encodeURIComponent(S.key)+meQ(id)).then(function(r){
    if(!r||r.error)throw new Error(r&&r.error);
    if(!r.data||!r.data.meta){notFound();return;}
    if(VIEW!=='trip'||S.last!==id)return;
    ARCH=!!r.archived;rev=r.rev;T=build(id,r.data);syncMe(T);base=clone(T);setOnline(r);
    openTrip._retry=0;savePrefs();render();setSync(ARCH?'':'ok');
    setTimeout(fixShortLinks,800);
  }).catch(function(e){
    if(e&&e.message==='forbidden'){toast('このしおりのメンバーではありません');goHome();return;}
    if(!openTrip._retry){openTrip._retry=1;setTimeout(function(){if(S.last===id&&!T&&VIEW==='trip')openTrip(id);},1500);return;}openTrip._retry=0;loadErr=true;render();});
}
function poll(){
  if(VIEW==='home'){if(S.key&&!document.hidden&&canHome()&&!homeBusy){homeBusy=true;loadMe().then(function(){if(VIEW==='home'&&canHome())renderHome();}).catch(function(){}).then(function(){homeBusy=false;});}return;}
  if(!T||ARCH||busy||queue.length||document.hidden)return;
  if(pending){if(canApply())applyResp(pending);return;}
  getJSON(API,'a=get&t='+encodeURIComponent(T.id)+'&k='+encodeURIComponent(S.key)+'&rev='+rev+meQ(T.id)).then(function(r){
    if(!r||r.error)throw 0;setSync('ok');setOnline(r);if(!r.same)applyResp(r);
  }).catch(function(){setSync('err');});
}
setInterval(poll,15000);
setInterval(function(){if(T&&tab==='schedule'&&!document.hidden&&canApply()){var y=app.scrollTop;render();app.scrollTop=y;}},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){poll();flush();}});
document.addEventListener('focusout',function(){setTimeout(function(){if(pending&&canApply())applyResp(pending);},300);});

function shareTrip(t){
  var url=tripUrl(t.id);
  if(navigator.share){navigator.share({title:t.title+' のしおり',text:t.title+' のしおりです。開いて自分の名前を選んでね',url:url}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('共有リンクをコピーしました');});}
  else prompt('このリンクを送ってください',url);
}

/* ---------- boot ---------- */
applyTheme(S.theme||'ryokan');
tab=S.tab||'schedule';
document.body.classList.add('sp');
(function(){
  var sp=document.getElementById('splash'),t0=Date.now(),done=false;
  function finish(fn){var w=Math.max(0,1500-(Date.now()-t0));setTimeout(function(){if(done)return;done=true;if(sp)sp.classList.add('out');document.body.classList.remove('sp');fn();},w);}
  if(!S.key){finish(renderSignup);return;}
  loadMe().then(function(){finish(function(){if(legacyList().length)renderMigrate();else{VIEW='home';renderHome();}});})
    .catch(function(e){finish(function(){renderHomeErr(e);});});
})();
})();
</script>
